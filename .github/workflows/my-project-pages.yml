name: iPhone Duo (my-project) CI & Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/my-project-pages.yml'
      - '115-1/web-programming/my-project/**'
  pull_request:
    paths:
      - '.github/workflows/my-project-pages.yml'
      - '115-1/web-programming/my-project/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 115-1/web-programming/my-project

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    concurrency:
      group: my-project-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install asset-prep dependencies
        run: pip install -r requirements-assets.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 115-1/web-programming/my-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Downloads Apple's official iPhone Duo reference model + screen
      # assets into src/public/ (gitignored — see .gitignore and
      # scripts/prepare-assets.py; not ours to redistribute in the repo).
      - name: Prepare Apple reference assets
        run: python3 scripts/prepare-assets.py

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # GitHub Pages serves a project repo under /<repo>/, not the domain
      # root, so the build needs that base baked in — see import.meta.env
      # .BASE_URL in scene.ts/ui.ts, which is how the app's own absolute
      # asset URLs (not just Vite's own bundle references) pick this up.
      - name: Build
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 115-1/web-programming/my-project/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
