name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - '115-1/data-structure/grouping/Practice-3D-files/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy files to Pages artifact
        run: |
          mkdir -p .webpage/115-1/data-structure/grouping
          cp -r 115-1/data-structure/grouping/Practice-3D-files \
            .webpage/115-1/data-structure/grouping/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.webpage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
