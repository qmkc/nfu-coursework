name: Deploy 115-1 Web Programming

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web-programming.yml'
      - '115-1/web-programming/src/**'
      - '115-1/web-programming/public/**'
      - '115-1/web-programming/next.config.ts'
      - '115-1/web-programming/tsconfig.json'
      - '115-1/web-programming/package.json'
      - '115-1/web-programming/pnpm-lock.yaml'
      - '115-1/web-programming/scripts/deploy.sh'
      - '115-1/web-programming/scripts/deploy-endpoint.php'
  workflow_dispatch:

concurrency:
  group: deploy-web-programming
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync to InfinityFree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 115-1/web-programming
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 115-1/web-programming/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Without this Next.js rebuilds everything from scratch on every run and
      # warns "No build cache found". The key changes with the lockfile or any
      # source file; restore-keys still reuse the closest older cache.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: 115-1/web-programming/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('115-1/web-programming/pnpm-lock.yaml') }}-${{ hashFiles('115-1/web-programming/src/**', '115-1/web-programming/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('115-1/web-programming/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build (Next.js static export to out/)
        run: pnpm run build

      - name: Check deploy secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ] && [ -n "${{ secrets.FTP_USERNAME }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ] && [ -n "${{ secrets.DEPLOY_TOKEN }}" ] && [ -n "${{ vars.SITE_URL }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / DEPLOY_TOKEN / SITE_URL not fully configured in repo secrets; skipping deploy."
          fi

      - name: Install lftp and jq
        if: steps.check-secrets.outputs.ok == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp jq

      - name: Deploy
        if: steps.check-secrets.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          FTP_REMOTE_BASE: ${{ vars.FTP_REMOTE_BASE || '/htdocs' }}
        run: bash ./scripts/deploy.sh
