name: Deploy 115-1 Web Programming (FTP)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftp-deploy-web-programming.yml'
      - '115-1/web-programming/src/**'
      - '115-1/web-programming/public/**'
      - '115-1/web-programming/composer.json'
      - '115-1/web-programming/composer.lock'
      - '115-1/web-programming/package.json'
      - '115-1/web-programming/pnpm-lock.yaml'
      - '115-1/web-programming/scripts/ftp-deploy.sh'
  workflow_dispatch:

concurrency:
  group: ftp-deploy-web-programming
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: FTP sync to InfinityFree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 115-1/web-programming
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 115-1/web-programming/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (renders static routes + bundles src/ and vendor/ into dist/runtime/)
        run: pnpm run --if-present build

      - name: Check FTP secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ] && [ -n "${{ secrets.FTP_USERNAME }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD not fully configured in repo secrets; skipping deploy."
          fi

      - name: Install lftp
        if: steps.check-secrets.outputs.ok == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to FTP server
        if: steps.check-secrets.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: ./scripts/ftp-deploy.sh
