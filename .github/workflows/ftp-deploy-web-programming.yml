name: Deploy 115-1 Web Programming (FTP)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftp-deploy-web-programming.yml'
      - '115-1/web-programming/src/**'
      - '115-1/web-programming/public/**'
      - '115-1/web-programming/composer.json'
      - '115-1/web-programming/composer.lock'
      - '115-1/web-programming/package.json'
      - '115-1/web-programming/pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: ftp-deploy-web-programming
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: FTP sync to InfinityFree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 115-1/web-programming
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 115-1/web-programming/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (renders static routes + bundles src/ and vendor/ into dist/runtime/)
        run: pnpm run --if-present build

      - name: Check FTP secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ] && [ -n "${{ secrets.FTP_USERNAME }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD not fully configured in repo secrets; skipping deploy."
          fi

      - name: Install lftp
        if: steps.check-secrets.outputs.ok == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Build content-hash manifest
        if: steps.check-secrets.outputs.ok == 'true'
        run: |
          set -euo pipefail
          : > new-manifest.txt
          find dist -type f | LC_ALL=C sort | while IFS= read -r f; do
            rel="${f#dist/}"
            if [ "$rel" = ".htaccess" ]; then
              remote="/.htaccess"
            else
              remote="/htdocs/$rel"
            fi
            hash=$(sha256sum -- "$f" | awk '{print $1}')
            printf '%s\t%s\n' "$remote" "$hash" >> new-manifest.txt
          done
          LC_ALL=C sort -o new-manifest.txt new-manifest.txt
          echo "$(wc -l < new-manifest.txt) files in build output"

      - name: Fetch previous manifest and diff
        if: steps.check-secrets.outputs.ok == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
            set ftp:passive-mode true;
            set cmd:fail-exit no;
            get /.deploy-manifest.txt -o old-manifest.txt;
            quit
          " "$FTP_SERVER" || true
          [ -s old-manifest.txt ] || : > old-manifest.txt
          LC_ALL=C sort -o old-manifest.txt old-manifest.txt

          # lines present in new but not old = added or content-changed
          LC_ALL=C comm -23 new-manifest.txt old-manifest.txt | cut -f1 > changed.txt

          # paths that existed before but dropped out of this build = removed
          cut -f1 old-manifest.txt | LC_ALL=C sort -u > old-paths.txt
          cut -f1 new-manifest.txt | LC_ALL=C sort -u > new-paths.txt
          LC_ALL=C comm -23 old-paths.txt new-paths.txt > removed.txt

          echo "$(wc -l < changed.txt) changed/added, $(wc -l < removed.txt) removed, $(wc -l < new-manifest.txt) total in build"

      - name: Deploy changed files via lftp
        if: steps.check-secrets.outputs.ok == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -s changed.txt ] && [ ! -s removed.txt ]; then
            echo "No content changes since last deploy — skipping upload."
            exit 0
          fi

          {
            echo 'set ftp:passive-mode true'
            echo 'set cmd:fail-exit no'
          } > lftp-script.txt

          : > dirs.txt
          while IFS= read -r remote; do
            [ -z "$remote" ] && continue
            dir="${remote%/*}"
            [ -z "$dir" ] && dir="/"
            echo "$dir" >> dirs.txt
          done < changed.txt
          LC_ALL=C sort -u -o dirs.txt dirs.txt

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            printf 'mkdir -p -f "%s"\n' "$dir" >> lftp-script.txt
          done < dirs.txt

          while IFS= read -r remote; do
            [ -z "$remote" ] && continue
            if [ "$remote" = "/.htaccess" ]; then
              local="dist/.htaccess"
            else
              local="dist${remote#/htdocs}"
            fi
            dir="${remote%/*}"
            [ -z "$dir" ] && dir="/"
            printf 'put -O "%s" "%s"\n' "$dir" "$local" >> lftp-script.txt
          done < changed.txt

          while IFS= read -r remote; do
            [ -z "$remote" ] && continue
            printf 'rm -f "%s"\n' "$remote" >> lftp-script.txt
          done < removed.txt

          {
            printf 'put -o "/.deploy-manifest.txt" "new-manifest.txt"\n'
            echo 'quit'
          } >> lftp-script.txt

          echo "----- lftp script -----"
          cat lftp-script.txt
          echo "------------------------"

          set +e
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -f lftp-script.txt "$FTP_SERVER"
          lftp_status=$?
          set -e
          echo "lftp exited with status $lftp_status (informational only — verifying below instead of trusting this directly)"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
            set ftp:passive-mode true;
            set cmd:fail-exit no;
            get /.deploy-manifest.txt -o uploaded-manifest.txt;
            quit
          " "$FTP_SERVER" || true

          if [ -s uploaded-manifest.txt ] && diff -q new-manifest.txt uploaded-manifest.txt > /dev/null; then
            echo "Verified: server manifest matches this build. Deploy succeeded."
          else
            echo "::error::Deploy verification failed — server's .deploy-manifest.txt does not match the build just uploaded."
            exit 1
          fi
